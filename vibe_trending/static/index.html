<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vibe Trending · 趋势研究</title><link rel="stylesheet" href="/style.css"></head>
<body><aside><a class="brand" href="/">Vibe Trending<span>趋势研究工作台</span></a><button id="new" class="primary">＋ 新建趋势</button><div class="nav-heading">研究项目 <span id="project-count">0</span></div><input id="project-search" type="search" aria-label="搜索项目" placeholder="搜索项目…"><nav id="projects" aria-label="研究项目"></nav><footer id="backend">连接中…</footer></aside>
<main><header><div><small>工作空间 / 趋势研究</small><h1 id="title">Vibe Trending</h1></div><span id="project-status" class="badge">就绪</span></header><div id="notice" role="status" aria-live="polite"></div>
<section id="creator"><div class="section-heading"><small>新建研究</small><h2>从一个问题，开始追踪趋势</h2><p class="muted">确认采集策略后获取数据，来源与修改记录始终可追溯。</p></div><form id="prompt-form"><label for="prompt">研究问题</label><textarea id="prompt" required maxlength="4000" placeholder="例如：对比中国和美国 2015 到 2024 年的人均 GDP 趋势">对比中国和美国 2015 到 2024 年的人均 GDP 趋势</textarea><div class="form-bottom"><span id="prompt-count" class="muted"></span><button type="submit" class="primary">生成采集策略 →</button></div></form><div class="examples"><button data-prompt="中国 2010 到 2024 年互联网普及率趋势">互联网普及率</button><button data-prompt="对比中国和日本 2015 到 2024 年人口趋势">人口对比</button><button data-prompt="搜索中国2024年月度汽车销量，单位万辆">汽车销量</button><button data-prompt="对比半导体ETF 512480 和证券ETF 512880 的2024到2026年每日收盘价，单位元">ETF 日行情</button></div><div id="strategy" hidden><div class="section-heading"><small>策略确认</small><h2>确认数据口径与来源</h2><p>World Bank / 公开网页 / 历史行情</p></div><label>项目标题<input id="plan-title" maxlength="160"></label><div class="row"><label>开始年份<input id="start" type="number" min="1960" max="2100"></label><label>结束年份<input id="end" type="number" min="1960" max="2100"></label></div><div id="plan-series"></div><p id="plan-notes" class="muted"></p><button id="confirm" class="primary">确认并采集数据</button></div></section>
<section id="workspace" hidden><div id="metrics" class="metrics"></div><div class="toolbar"><div class="tabs" role="tablist" aria-label="项目视图"><button data-tab="chart" role="tab" aria-selected="true" class="active">趋势图</button><button data-tab="data" role="tab" aria-selected="false">数据与来源</button><button data-tab="history" role="tab" aria-selected="false">更新与版本</button></div><div class="commands"><button id="vibe-edit">Vibe edit</button><button id="refresh">↻ 更新数据</button><a id="csv" title="下载 CSV">CSV ↓</a><button id="png" title="下载 PNG">PNG ↓</button><button id="remove" class="danger">删除</button></div></div>
<div id="chart-tab" role="tabpanel"><div class="row controls"><label>图表标题<input id="chart-title" maxlength="160"></label><label>图表类型<select id="chart-type"><option value="line">折线图</option><option value="area">面积图</option><option value="bar">柱状图</option></select></label><label class="check"><input id="normalize" type="checkbox">起点标准化 = 100</label></div><div id="comparability" class="warning"></div><div id="legend"></div><div class="plot"><canvas id="chart" role="img" aria-label="趋势对比图"></canvas><div id="chart-tooltip" hidden></div></div><p id="evidence" class="muted"></p><details id="collection-warnings" hidden><summary>采集提示</summary><div id="warnings-list"></div></details></div>
<div id="data-tab" role="tabpanel" hidden><div class="row data-controls"><label>数据序列<select id="series-select"></select></label><label>日期筛选<input id="filter" type="search" placeholder="例如 2024 或 2024-01"></label><label>排序<select id="sort"><option value="desc">最新日期优先</option><option value="asc">最早日期优先</option></select></label><button id="add-point">＋ 新增数据点</button></div><div class="table-wrap"><table><thead><tr><th>日期</th><th>数值</th><th>单位</th><th>质量状态</th><th>来源证据</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><div class="pagination"><span id="row-count" class="muted"></span><div><button id="prev-page" aria-label="上一页">←</button><span id="page-number"></span><button id="next-page" aria-label="下一页">→</button></div></div></div>
<div id="history-tab" role="tabpanel" hidden><h2>自动更新</h2><form id="schedule-form" class="row"><label class="check"><input id="scheduled" type="checkbox">启用自动更新</label><label>频率<select id="frequency"><option value="daily">每日</option><option value="weekly">每周一</option><option value="monthly">每月 1 日</option></select></label><label>时间<input id="time" type="time" value="09:00" required></label><label>时区<input id="timezone" value="Asia/Shanghai" required></label><button>保存设置</button></form><p id="next-run" class="muted"></p><h2>采集记录</h2><div id="tasks"></div><h2>版本快照</h2><div id="versions"></div><h2>人工修改审计</h2><div id="audit"></div></div></section>
</main><dialog id="edit-dialog"><form id="edit-form"><h2>人工确认数据</h2><label>日期<input id="edit-date" pattern="\d{4}(-\d{2}(-\d{2})?)?" required placeholder="YYYY / YYYY-MM / YYYY-MM-DD"></label><label>数值<input id="edit-value" type="number" step="any" required></label><label>来源链接<input id="edit-source" type="url" required></label><label>修改原因<input id="edit-reason" required maxlength="500"></label><div class="dialog-actions"><button type="button" id="cancel-edit">取消</button><button class="primary">保存确认值</button></div></form></dialog><dialog id="confirm-dialog"><form method="dialog"><h2 id="confirm-title"></h2><p id="confirm-message"></p><div class="dialog-actions"><button value="cancel">取消</button><button value="confirm" id="confirm-action" class="primary">确认</button></div></form></dialog><dialog id="vibe-dialog"><div class="vibe-heading"><div><small>VIBE EDIT</small><h2>调整研究策略</h2></div><button id="close-vibe" type="button" aria-label="关闭策略编辑">×</button></div><form id="vibe-form"><label for="vibe-prompt">你想怎么调整？</label><textarea id="vibe-prompt" required minlength="2" maxlength="4000" placeholder="例如：保留现有序列，新增日本人均 GDP；或把汽车销量来源改成我给的网址…"></textarea><div class="dialog-actions"><button id="generate-edit" class="primary">生成编辑方案</button></div></form><p id="vibe-notice" role="status" aria-live="polite"></p><div id="vibe-preview" hidden><div id="vibe-diff" class="warning"></div><label>项目标题<input id="vibe-title" maxlength="160"></label><div class="row"><label>开始年份<input id="vibe-start" type="number" min="1960" max="2100"></label><label>结束年份<input id="vibe-end" type="number" min="1960" max="2100"></label></div><div id="vibe-series"></div><label class="check"><input id="vibe-collect" type="checkbox" checked>应用后采集新增 / 调整的数据</label><div class="dialog-actions"><button id="cancel-vibe" type="button">取消</button><button id="apply-vibe" type="button" class="primary">应用编辑方案</button></div></div></dialog>
<script src="/app.js"></script></body></html>
