[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibe-trending"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "websockets>=12", "pydantic>=2", "PyYAML>=6", "python-dotenv>=1", "ddgs>=9,<10", "trafilatura>=2,<3", "mcp>=1.12,<2", "certifi"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=1,<1.4"]

[tool.setuptools.packages.find]
include = ["vibe_trending*"]

[tool.setuptools.package-data]
vibe_trending = ["static/*"]
